<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Course Details</title>
</head>
<body>
    <div class="container">
        <h1>{{ course.name }}</h1>
        <p>Welcome to the course!</p>
        <h2>Lessons:</h2>
        <ul>
            {% for lesson in course.lesson_set.all %}
                <li>{{ lesson.name }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
